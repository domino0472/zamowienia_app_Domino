version: '3.6'
services:

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.40.0
    container_name: openobserve
    environment:
      - ZO_DATA_DIR=/data
      - ZO_ROOT_USER_EMAIL=root@example.com
      - ZO_ROOT_USER_PASSWORD=pass
    volumes:
      - "./openobserve_data:/data"
    ports:
      - "5080:5080"
    restart: always

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: always
  registry:
    image: registry:2
    container_name: registry
    ports:
      - "5000:5000"
    restart: always
    volumes:
      - registry_data:/var/lib/registry

  gitlab-runner:
    image: "gitlab/gitlab-runner:alpine3.21"
    container_name: "gitlab-runner"
    restart: always
    volumes:

      - "/var/run/docker.sock:/var/run/docker.sock"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  gitlab:

    image: 'gitlab/gitlab-ce:latest'
    container_name: gitlab


    

    restart: always
    
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        
        
        gitlab_rails['time_zone'] = 'Europe/Warsaw'
        external_url 'http://host.docker.internal:4321'
        
        # Konfiguracja Nginx (port i wyłączenie HTTPS)
        letsencrypt['enable'] = false
        nginx['listen_port'] = 4321
        nginx['listen_ssl_port'] = 443
        nginx['redirect_http_to_https'] = false
        nginx['gzip_enabled'] = false 
        
        
        gitlab_kas['enable'] = false
        
        mattermost['enable'] = false
        prometheus['enable'] = false
        alertmanager['enable'] = false
        prometheus['monitoring'] = false
        node_exporter['enable'] = false
        redis_exporter['enable'] = false
        gitlab_exporter['enable'] = false
        monitoring_role['enable'] = false 
        
        # Ustawienia sidekiq
        sidekiq['max_processes'] = 0 
        sidekiq['concurrency'] = 10
        
        # Inne wyłączenia
        gitlab_rails['usage_ping_enabled'] = false 
        logrotate['enable'] = false
        gitlab_rails['gitlab_kas_enabled'] = false

    
        redis_sentinel_role['enable'] = false
        sentinel['enable'] = false
        gitlab_rails['registry_enabled'] = false
        sidekiq['health_checks_enabled'] = false
        gitlab_rails['sentry_enabled'] = false
        gitlab_rails['packages_enabled'] = false
        gitlab_rails['dependency_proxy_enabled'] = false
        gitlab_rails['geo_registry_replication_enabled'] = false
        gitlab_rails['git_email_enabled'] = false
        gitlab_rails['incoming_email_enabled'] = false
        gitlab_rails['artifacts_enabled'] = false
        gitlab_rails['lfs_enabled'] = false
        gitlab_rails['terraform_state_enabled'] = false
        gitlab_rails['ci_secure_files_enabled'] = false
    

    ports:
      - '4321:4321'
    extra_hosts:
      - 'host.docker.internal:host-gateway'


    volumes:

      - "./config:/etc/gitlab:z"
      - "./logs:/var/log/gitlab:z"
      - "./data:/var/opt/gitlab:z"
volumes:
  registry_data: